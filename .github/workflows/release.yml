name: Release

# Stealth-friendly trigger model.
#
# Nothing is ever PUBLIC by accident:
#   - pushing a branch  -> ci.yml only (verify, no artifacts)
#   - pushing a v* tag  -> builds every platform/arch combination, uploads each
#                          as its OWN run artifact, and creates a DRAFT release
#                          whose assets are the raw files (no zip wrapper)
#   - manual dispatch   -> same, with an opt-in checkbox for the draft release
#
# Why the draft release exists at all: GitHub Actions *artifacts* are always
# delivered as a zip container - that is platform behaviour we cannot change.
# Release assets, by contrast, are served as-is. A draft is invisible to anyone
# without repo write access and never appears in the public release feed; it
# only becomes public when someone clicks Publish.
#
# Artifacts are uploaded per (platform, arch) on purpose: fetching the Linux
# x64 package must not drag the arm64 one (or any other platform) along with it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also create a draft GitHub Release (stays unpublished until you click Publish)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            flag: '--x64'
            extra: ''
            label: 'Windows x64'
          # CI builds the unpacked .app (dir target) and tars it into a runnable
          # package: GitHub macOS runners cannot run `hdiutil attach`
          # ("Device not configured"), which the dmg target requires.
          # A local `npm run dist:mac` on a real Mac still produces the dmg.
          # `-c.mac.identity=-` forces an ad-hoc signature. electron-builder only
          # falls back to ad-hoc automatically for arm64/universal
          # (macPackager.js: fallBackToAdhoc), so with identity auto-discovery
          # off the x64 build produced a completely UNSIGNED bundle while the
          # README advertised "ad-hoc signed". Both mac legs now sign ad-hoc, so
          # the documented behaviour is true for both and the verify step can be
          # a hard gate.
          - os: macos-14
            platform: mac
            arch: x64
            flag: '--x64'
            extra: '-c.mac.target=dir -c.mac.identity=-'
            label: 'macOS x64'
          - os: macos-14
            platform: mac
            arch: arm64
            flag: '--arm64'
            extra: '-c.mac.target=dir -c.mac.identity=-'
            label: 'macOS arm64'
          # Linux ships two architectures as two jobs. The arch MUST come from
          # `--x64` / `--arm64`: a target name cannot carry it (`--linux
          # AppImage:x64` is rejected as an unknown argument - the array option
          # stops at the next `--flag`, so the tokens never reach it).
          #
          # For that flag to mean anything, electron-builder.yml's linux.target
          # lists no arch - while it did, `--x64` was silently ignored and every
          # job built both (computeArchToTargetNamesMap() only consults the CLI
          # for target names it invents itself, and otherwise expands the arch
          # list from the config), which is how the arm64 package ended up
          # inside the x64 artifact.
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            flag: '--x64'
            extra: ''
            label: 'Linux x64'
          - os: ubuntu-22.04
            platform: linux
            arch: arm64
            flag: '--arm64'
            extra: ''
            label: 'Linux arm64'
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell, which breaks the Unix tooling used
    # below (ls, line continuations). bash ships on all three runner images.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # electron-builder needs these only on Linux (AppImage/deb packaging tools
      # shell out to them). macOS/Windows runners need nothing extra.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg rpm libarchive-tools

      # Packaging consumes dist/, so it must exist before electron-builder runs.
      - name: Build app bundle
        run: npm run build
        env:
          APP_REPO: ${{ github.repository }}
          APP_VERSION: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

      # Fail fast with an obvious message instead of an asar sanity-check error.
      - name: Verify bundle before packaging
        run: |
          node -e '
            const fs = require("fs");
            const required = [
              "dist/main/index.js",
              "dist/preload/index.js",
              "dist/renderer/index.html"
            ];
            const missing = required.filter((f) => !fs.existsSync(f));
            if (missing.length > 0) {
              console.error("::error::bundle incomplete, missing: " + missing.join(", "));
              process.exit(1);
            }
            console.log("bundle ok: " + required.join(", "));
          '

      - name: Build installers
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.flag }} ${{ matrix.extra }} --publish never
        env:
          # Builds are unsigned by design; make that explicit so a missing
          # certificate never silently changes the output.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # macOS: turn the unpacked .app into a single runnable archive.
      - name: Package the .app as a runnable tar.gz
        if: matrix.platform == 'mac'
        run: |
          APP_DIR="$(find release -maxdepth 2 -name '*.app' -type d -print -quit)"
          if [ -z "$APP_DIR" ]; then
            echo "::error::electron-builder produced no .app directory"
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          OUT="release/ipatool-gui-${VERSION}-mac-${{ matrix.arch }}.app.tar.gz"
          tar -czf "$OUT" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
          echo "packaged $OUT from $APP_DIR"

      # The only look anyone gets at the macOS bundle: nobody on this project
      # owns a Mac, so this records what codesign and Gatekeeper make of the
      # artifact that actually ships (a downloaded ad-hoc signed app is reported
      # by macOS as "damaged" - see the README; this proves the bundle itself is
      # intact and correctly signed).
      #
      # This step is now a hard gate on the two things that make the artifact
      # usable: a signature that verifies, and an archive that kept its symlinks
      # (an .app that lost them is genuinely broken, not merely unsigned).
      # Gatekeeper rejection (spctl) stays informational: the build is not
      # notarized by design, so a rejection is the documented, expected outcome.
      - name: Verify the macOS bundle (signature, archive integrity)
        if: matrix.platform == 'mac'
        run: |
          APP_DIR="$(find release -maxdepth 2 -name '*.app' -type d -print -quit)"
          if [ -z "$APP_DIR" ]; then
            echo "::error::no .app to verify"
            exit 1
          fi

          echo "--- signature ---"
          codesign -dv --verbose=2 "$APP_DIR" 2>&1 | head -15 || true

          echo "--- codesign --verify --deep --strict ---"
          if codesign --verify --deep --strict --verbose=2 "$APP_DIR" 2>&1; then
            echo "signature verify: OK"
          else
            echo "::error::codesign --verify failed - the app will not launch on macOS"
            exit 1
          fi

          echo "--- what Gatekeeper will say (rejection is expected: not notarized) ---"
          spctl -a -t exec -vv "$APP_DIR" 2>&1 || true

          echo "--- symlinks preserved in the archive ---"
          for archive in release/*.app.tar.gz; do
            count="$(tar -tzvf "$archive" | grep -c '^l' || true)"
            echo "$archive: $count symlink entries"
            if [ "$count" -lt 10 ]; then
              echo "::error::$archive kept only $count symlinks - the .app is broken"
              exit 1
            fi
          done

      # Publish a checksum manifest so a download can be tied to this run.
      # Without it a user has no way to verify what they installed, and the
      # project ships unsigned binaries.
      # Runs through scripts/sha256sums.mjs rather than sha256sum: macOS runners
      # ship `shasum -a 256` only, BSD sort/xargs have no `-z`/`-0`, and artifact
      # names contain spaces ("IPATool GUI-..."), which plain xargs would split.
      # The script exits non-zero when there is nothing to checksum, so an empty
      # manifest can never be published.
      - name: Write SHA-256 manifest
        run: node scripts/sha256sums.mjs release

      - name: List artifacts
        run: ls -lh release/

      # Pure node so it behaves identically on every OS and shell.
      - name: Add artifact list to job summary
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "release";
            const rows = fs.readdirSync(dir)
              .map((name) => ({ name, full: path.join(dir, name) }))
              .filter((r) => fs.statSync(r.full).isFile())
              .map((r) => ({ name: r.name, size: fs.statSync(r.full).size }))
              .sort((a, b) => b.size - a.size);
            const mb = (n) => (n / 1024 / 1024).toFixed(1) + " MB";
            const lines = [
              "## Artifacts - ${{ matrix.label }}", "",
              ...rows.map((r) => "- `" + r.name + "` (" + mb(r.size) + ")"),
              "",
              "Download **release-${{ matrix.platform }}-${{ matrix.arch }}** from",
              "Artifacts on this run - each platform/arch is uploaded separately.",
              ""
            ];
            const text = lines.join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
            console.log(text);
          '

      - uses: actions/upload-artifact@v7
        with:
          # One artifact per platform+arch so a single package can be fetched
          # without downloading unrelated builds.
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.app.tar.gz
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create DRAFT release (raw assets, hidden until published)
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes get a draft automatically (raw, unzipped downloads for the team);
    # dispatches only when the checkbox is ticked. Drafts are not public.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    steps:
      # Checkout FIRST, before the artifacts are downloaded. actions/checkout
      # defaults to clean: true, which runs `git clean -ffdx` against the
      # workspace - downloading the artifacts first meant that clean deleted
      # them, and the next step failed with
      # `ENOENT: no such file or directory, scandir 'artifacts'`.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Each build job wrote its own SHA256SUMS.txt and merge-multiple flattens
      # them onto one path, so the manifest is rebuilt from the artifacts that are
      # actually about to be published. Needs the checkout for scripts/.
      - name: Merge checksum manifests
        run: node scripts/sha256sums.mjs artifacts

      - name: Create DRAFT GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="v$(date +%Y.%m.%d)-${GITHUB_RUN_ID}"; fi

          # Previous *published* release, for the compare link. /releases/latest
          # excludes drafts and prereleases, so the draft for v0.2.0 links back to
          # v0.1.1 rather than to an earlier draft of its own.
          PREV="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [[ -n "$PREV" ]]; then
            CHANGELOG="**Full changelog:** [${PREV}...${TAG}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG})"
          else
            CHANGELOG="**Full changelog:** [${TAG}](https://github.com/${GITHUB_REPOSITORY}/commits/${TAG})"
          fi

          # Notes go through a file: the body has quotes and backticks that would
          # otherwise be eaten by the shell inside --notes "...".
          #
          # Layout mirrors the hand-written v0.1.1 notes: a "What's new" body, the
          # install section, then the compare link. The body is a placeholder here
          # because it is written per release, after the draft exists; the install
          # section deliberately just points at the README, which is the one place
          # per-platform steps are kept up to date.
          {
            echo "## IPATool GUI ${TAG}"
            echo
            echo "<!-- What's new: replace this comment with the highlights for this release. -->"
            echo
            echo '### Install & macOS Gatekeeper note'
            echo
            echo 'See the [README](https://github.com/a23bc/ipatool-gui#install) for per-platform install steps and the one-line `xattr` fix if macOS says the app is damaged.'
            echo
            echo "$CHANGELOG"
          } > /tmp/release-notes.md
          # -R is explicit on purpose: without it gh infers the repository from
          # the local git remote, which only exists because of the checkout above.
          # Relying on that is what made this step fail with
          # `failed to run git: fatal: not a git repository` before the checkout
          # existed, and would fail again if the steps were ever reordered.
          gh release create "$TAG" \
            -R "$GITHUB_REPOSITORY" \
            --title "IPATool GUI ${TAG}" \
            --draft \
            --notes-file /tmp/release-notes.md \
            artifacts/*
